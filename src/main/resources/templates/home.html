<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang Chủ - Sản Phẩm GraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css" />
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Trang Chủ - Cửa Hàng Sản Phẩm</h2>
        <div>
            <a th:href="@{/products}" class="btn btn-outline-info me-2">Quản lý Product</a>
            <a th:href="@{/categories}" class="btn btn-outline-secondary me-2">Quản lý Category</a>
            <a href="/graphiql" target="_blank" class="btn btn-outline-dark">
                <i class="fas fa-terminal me-1"></i>GraphiQL
            </a>
        </div>
    </div>

    <div class="row mb-4 g-2 align-items-center">
        <div class="col-md-4">
            <select id="filterCategory" class="form-select">
                <option value="">-- Tất cả danh mục --</option>
            </select>
        </div>
        <div class="col-md-5 d-flex gap-2">
            <button id="sortPriceAscBtn" type="button" class="btn btn-primary">
                <i class="fas fa-sort-amount-down-alt me-1"></i> Giá từ thấp đến cao
            </button>
            <button id="resetBtn" type="button" class="btn btn-outline-secondary">
                <i class="fas fa-redo me-1"></i> Mặc định
            </button>
        </div>
        <div class="col-md-3 text-md-end text-muted small" id="productCount">
            0 sản phẩm
        </div>
    </div>

    <div class="row g-3" id="productGrid">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        function executeGraphQL(query, variables = {}) {
            return fetch('/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ query, variables })
            })
            .then(res => res.json())
            .then(res => {
                if (res.errors) {
                    throw new Error(res.errors.map(e => e.message).join(', '));
                }
                return res.data;
            });
        }

        function formatCurrency(amount) {
            return Number(amount || 0).toLocaleString('vi-VN') + ' đ';
        }

        function getImageUrl(imageName) {
            if (!imageName || imageName.trim() === '') {
                return 'https://placehold.co/400x300?text=No+Image';
            }
            if (imageName.startsWith('http')) {
                return imageName;
            }
            return '/api/files/' + imageName;
        }

        function loadCategories() {
            const query = `
                query {
                    allCategories {
                        categoryId
                        categoryName
                    }
                }
            `;
            executeGraphQL(query).then(data => {
                const list = data.allCategories || [];
                let options = '<option value="">-- Tất cả danh mục --</option>';
                list.forEach(c => {
                    options += '<option value="' + c.categoryId + '">' + c.categoryName + '</option>';
                });
                $('#filterCategory').html(options);
            });
        }

        function renderProducts(products) {
            const grid = $('#productGrid');
            grid.empty();
            $('#productCount').text(products.length + ' sản phẩm');

            if (products.length === 0) {
                grid.html('<div class="col-12 text-center py-5 text-muted"><i class="fas fa-box-open fa-3x mb-3 d-block"></i>Không tìm thấy sản phẩm nào</div>');
                return;
            }

            products.forEach(p => {
                const catName = p.category ? p.category.categoryName : 'Chưa phân loại';
                const html = `
                    <div class="col-lg-3 col-md-4 col-sm-6">
                        <div class="card h-100 shadow-sm border">
                            <img src="${getImageUrl(p.images)}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="${p.productName}">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-info text-dark mb-2 align-self-start">${catName}</span>
                                <h6 class="card-title fw-bold text-truncate" title="${p.productName}">${p.productName}</h6>
                                <p class="card-text text-muted small text-truncate mb-3">${p.description || 'Không có mô tả'}</p>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <span class="text-danger fw-bold fs-5">${formatCurrency(p.unitPrice)}</span>
                                    <span class="badge bg-secondary">SL: ${p.quantity}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.append(html);
            });
        }

        function loadAllProductsOrderByPriceAsc() {
            const query = `
                query {
                    allProductsOrderByPriceAsc {
                        productId
                        productName
                        quantity
                        unitPrice
                        images
                        description
                        discount
                        category {
                            categoryId
                            categoryName
                        }
                    }
                }
            `;
            executeGraphQL(query).then(data => {
                renderProducts(data.allProductsOrderByPriceAsc || []);
            });
        }

        function loadProductsByCategory(categoryId) {
            if (!categoryId) {
                loadAllProductsDefault();
                return;
            }
            const query = `
                query GetProductsByCat($categoryId: ID!) {
                    productsByCategory(categoryId: $categoryId) {
                        productId
                        productName
                        quantity
                        unitPrice
                        images
                        description
                        discount
                        category {
                            categoryId
                            categoryName
                        }
                    }
                }
            `;
            executeGraphQL(query, { categoryId }).then(data => {
                renderProducts(data.productsByCategory || []);
            });
        }

        function loadAllProductsDefault() {
            const query = `
                query {
                    searchProducts(page: 0, size: 100) {
                        content {
                            productId
                            productName
                            quantity
                            unitPrice
                            images
                            description
                            discount
                            category {
                                categoryId
                                categoryName
                            }
                        }
                    }
                }
            `;
            executeGraphQL(query).then(data => {
                renderProducts(data.searchProducts ? data.searchProducts.content : []);
            });
        }

        $(document).ready(function() {
            loadCategories();
            loadAllProductsOrderByPriceAsc();

            $('#sortPriceAscBtn').click(function() {
                $('#filterCategory').val('');
                loadAllProductsOrderByPriceAsc();
            });

            $('#filterCategory').change(function() {
                const catId = $(this).val();
                loadProductsByCategory(catId);
            });

            $('#resetBtn').click(function() {
                $('#filterCategory').val('');
                loadAllProductsDefault();
            });
        });
    </script>
</body>
</html>
