<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajax CRUD Product GraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản lý Product Ajax bằng GraphQL</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-primary me-2">Trang Chủ</a>
            <a th:href="@{/categories}" class="btn btn-outline-secondary me-2">Quản lý Category</a>
            <button class="btn btn-success" onclick="showCreateNewProductModal()">
                <i class="fas fa-plus me-2"></i>Thêm Product Ajax
            </button>
        </div>
    </div>

    <div class="row mb-3 g-2">
        <div class="col-md-4">
            <input type="text" id="searchProductName" class="form-control" placeholder="Tìm theo tên sản phẩm...">
        </div>
        <div class="col-md-3">
            <select id="filterCategory" class="form-select">
                <option value="">-- Tất cả danh mục --</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-1">
            <button class="btn btn-primary" onclick="loadProducts(0)"><i class="fas fa-search"></i> Tìm</button>
            <button class="btn btn-outline-secondary" onclick="resetSearch()"><i class="fas fa-redo"></i></button>
        </div>
    </div>

    <table class="table table-striped table-bordered table-responsive">
        <thead class="table-dark">
            <tr>
                <th>Id</th>
                <th>Ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Danh mục</th>
                <th>Đơn giá</th>
                <th>Giảm giá</th>
                <th>Số lượng</th>
                <th>Trạng thái</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" id="paginationInfo"></span>
        <ul class="pagination pagination-sm mb-0" id="paginationNav"></ul>
    </div>

    <div class="modal fade" tabindex="-1" role="dialog" id="createProductModal">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <form id="addProduct" method="post" onsubmit="return false;" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên sản phẩm</label>
                                <input type="text" class="form-control" name="productName" id="addProductName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Danh mục</label>
                                <select class="form-select" id="addCategorySelect" name="categoryId" required>
                                    <option value="">-- Chọn danh mục --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Đơn giá</label>
                                <input type="number" class="form-control" name="unitPrice" id="addUnitPrice" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Giảm giá (%)</label>
                                <input type="number" class="form-control" name="discount" id="addDiscount" min="0" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Số lượng</label>
                                <input type="number" class="form-control" name="quantity" id="addQuantity" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" name="status" id="addStatus">
                                    <option value="1">Hoạt động</option>
                                    <option value="0">Tạm khóa</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ảnh sản phẩm</label>
                                <input type="file" class="form-control" id="addImageFile" name="imageFile" accept="image/*">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control" name="description" id="addDescription" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Thêm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" tabindex="-1" role="dialog" id="updateProductModal">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <form id="updateProduct" method="post" onsubmit="return false;" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Update Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editProductId" name="productId">
                        <input type="hidden" id="editImageOld" name="imageOld">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên sản phẩm</label>
                                <input type="text" class="form-control" id="editProductName" name="productName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Danh mục</label>
                                <select class="form-select" id="editCategorySelect" name="categoryId">
                                    <option value="">-- Chọn danh mục --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Đơn giá</label>
                                <input type="number" class="form-control" id="editUnitPrice" name="unitPrice" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Giảm giá (%)</label>
                                <input type="number" class="form-control" id="editDiscount" name="discount" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Số lượng</label>
                                <input type="number" class="form-control" id="editQuantity" name="quantity" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" id="editStatus" name="status">
                                    <option value="1">Hoạt động</option>
                                    <option value="0">Tạm khóa</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ảnh mới (để trống nếu giữ nguyên)</label>
                                <input type="file" class="form-control" id="editImageFile" name="imageFile" accept="image/*">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control" id="editDescription" name="description" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        let currentPage = 0;
        const pageSize = 5;

        function executeGraphQL(query, variables = {}) {
            return fetch('/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ query, variables })
            })
            .then(res => res.json())
            .then(res => {
                if (res.errors) {
                    throw new Error(res.errors.map(e => e.message).join(', '));
                }
                return res.data;
            });
        }

        $(document).ready(function() {
            loadCategories();
            loadProducts(0);

            $('#searchProductName, #filterCategory').on('input change', function() {
                loadProducts(0);
            });
        });

        function loadCategories() {
            const query = `
                query {
                    allCategories {
                        categoryId
                        categoryName
                    }
                }
            `;
            executeGraphQL(query).then(data => {
                const list = data.allCategories || [];
                let filterOpt = '<option value="">-- Tất cả danh mục --</option>';
                let formOpt = '<option value="">-- Chọn danh mục --</option>';
                list.forEach(c => {
                    filterOpt += '<option value="' + c.categoryId + '">' + c.categoryName + '</option>';
                    formOpt += '<option value="' + c.categoryId + '">' + c.categoryName + '</option>';
                });
                $('#filterCategory').html(filterOpt);
                $('#addCategorySelect').html(formOpt);
                $('#editCategorySelect').html(formOpt);
            });
        }

        function loadProducts(page = 0) {
            currentPage = page;
            const name = $('#searchProductName').val().trim();
            const catId = $('#filterCategory').val() || null;

            const query = `
                query SearchProducts($name: String, $categoryId: ID, $page: Int, $size: Int) {
                    searchProducts(name: $name, categoryId: $categoryId, page: $page, size: $size) {
                        content {
                            productId
                            productName
                            quantity
                            unitPrice
                            images
                            description
                            discount
                            status
                            category {
                                categoryId
                                categoryName
                            }
                        }
                        totalPages
                        totalElements
                        currentPage
                        pageSize
                    }
                }
            `;

            executeGraphQL(query, { name, categoryId: catId, page, size: pageSize })
                .then(data => {
                    const pageData = data.searchProducts;
                    const list = pageData.content || [];
                    const tr = [];

                    for (let i = 0; i < list.length; i++) {
                        const p = list[i];
                        const imgUrl = p.images ? '/api/files/' + p.images : 'https://placehold.co/50x50?text=None';
                        const img = '<img src="' + imgUrl + '" style="width:50px;height:50px;object-fit:cover;" class="rounded" alt="">';
                        const catName = p.category ? p.category.categoryName : '';
                        const status = p.status === 1 ? '<span class="badge bg-success">Hoạt động</span>' : '<span class="badge bg-secondary">Tạm khóa</span>';

                        tr.push('<tr id="row-pro-' + p.productId + '">');
                        tr.push('<td>' + p.productId + '</td>');
                        tr.push('<td>' + img + '</td>');
                        tr.push('<td>' + p.productName + '</td>');
                        tr.push('<td>' + catName + '</td>');
                        tr.push('<td>' + Number(p.unitPrice).toLocaleString() + ' đ</td>');
                        tr.push('<td>' + (p.discount || 0) + '%</td>');
                        tr.push('<td>' + p.quantity + '</td>');
                        tr.push('<td>' + status + '</td>');
                        tr.push('<td>'
                            + '<a href="#" data-id="' + p.productId + '" class="btn btn-outline-warning btn-sm editpro me-1"><i class="fa fa-edit"></i></a>'
                            + '<a href="#" data-id="' + p.productId + '" class="btn btn-outline-danger btn-sm deletepro"><i class="fa fa-trash"></i></a>'
                            + '</td>');
                        tr.push('</tr>');
                    }

                    if (list.length === 0) {
                        $('#productTableBody').html('<tr><td colspan="9" class="text-center py-3 text-muted">Không có dữ liệu</td></tr>');
                    } else {
                        $('#productTableBody').html(tr.join(''));
                    }

                    renderPagination(pageData.totalPages, pageData.currentPage, pageData.totalElements);
                });
        }

        function renderPagination(totalPages, activePage, totalElements) {
            $('#paginationInfo').text(`Trang ${totalPages > 0 ? activePage + 1 : 0} / ${totalPages} (Tổng: ${totalElements})`);
            const nav = $('#paginationNav');
            nav.empty();

            if (totalPages <= 1) return;

            const prevDisabled = activePage === 0 ? 'disabled' : '';
            nav.append(`<li class="page-item ${prevDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadProducts(${activePage - 1})">Trước</a></li>`);

            for (let i = 0; i < totalPages; i++) {
                const active = i === activePage ? 'active' : '';
                nav.append(`<li class="page-item ${active}"><a class="page-link" href="javascript:void(0)" onclick="loadProducts(${i})">${i + 1}</a></li>`);
            }

            const nextDisabled = activePage === totalPages - 1 ? 'disabled' : '';
            nav.append(`<li class="page-item ${nextDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadProducts(${activePage + 1})">Sau</a></li>`);
        }

        function resetSearch() {
            $('#searchProductName').val('');
            $('#filterCategory').val('');
            loadProducts(0);
        }

        function showCreateNewProductModal() {
            $('#addProduct')[0].reset();
            const modal = new bootstrap.Modal(document.getElementById('createProductModal'));
            modal.show();
        }

        async function uploadFile(inputId) {
            const fileInput = document.getElementById(inputId);
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const res = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    return await res.text();
                }
            }
            return '';
        }

        $("form#addProduct").submit(async function(e) {
            e.preventDefault();
            const images = await uploadFile('addImageFile');
            const input = {
                productName: $('#addProductName').val().trim(),
                categoryId: $('#addCategorySelect').val() || null,
                unitPrice: parseFloat($('#addUnitPrice').val()),
                discount: parseFloat($('#addDiscount').val() || 0),
                quantity: parseInt($('#addQuantity').val()),
                status: parseInt($('#addStatus').val()),
                description: $('#addDescription').val().trim(),
                images: images
            };

            const mutation = `
                mutation CreateProduct($input: ProductInput!) {
                    createProduct(input: $input) {
                        productId
                        productName
                    }
                }
            `;

            executeGraphQL(mutation, { input })
                .then(() => {
                    bootstrap.Modal.getInstance(document.getElementById('createProductModal')).hide();
                    loadProducts(0);
                });
        });

        $(document).on('click', '.editpro', function(e) {
            e.preventDefault();
            const id = $(this).data('id');
            const query = `
                query GetProduct($id: ID!) {
                    productById(productId: $id) {
                        productId
                        productName
                        quantity
                        unitPrice
                        images
                        description
                        discount
                        status
                        category {
                            categoryId
                        }
                    }
                }
            `;

            executeGraphQL(query, { id }).then(data => {
                const p = data.productById;
                if (!p) return;
                $('#editProductId').val(p.productId);
                $('#editProductName').val(p.productName);
                $('#editUnitPrice').val(p.unitPrice);
                $('#editDiscount').val(p.discount || 0);
                $('#editQuantity').val(p.quantity);
                $('#editStatus').val(p.status);
                $('#editDescription').val(p.description || '');
                $('#editImageOld').val(p.images || '');
                $('#editImageFile').val('');
                if (p.category) {
                    $('#editCategorySelect').val(p.category.categoryId);
                } else {
                    $('#editCategorySelect').val('');
                }

                const modal = new bootstrap.Modal(document.getElementById('updateProductModal'));
                modal.show();
            });
        });

        $("form#updateProduct").submit(async function(e) {
            e.preventDefault();
            const id = $('#editProductId').val();
            let images = await uploadFile('editImageFile');
            if (!images) {
                images = $('#editImageOld').val();
            }

            const input = {
                productName: $('#editProductName').val().trim(),
                categoryId: $('#editCategorySelect').val() || null,
                unitPrice: parseFloat($('#editUnitPrice').val()),
                discount: parseFloat($('#editDiscount').val() || 0),
                quantity: parseInt($('#editQuantity').val()),
                status: parseInt($('#editStatus').val()),
                description: $('#editDescription').val().trim(),
                images: images
            };

            const mutation = `
                mutation UpdateProduct($id: ID!, $input: ProductInput!) {
                    updateProduct(productId: $id, input: $input) {
                        productId
                        productName
                    }
                }
            `;

            executeGraphQL(mutation, { id, input })
                .then(() => {
                    bootstrap.Modal.getInstance(document.getElementById('updateProductModal')).hide();
                    loadProducts(currentPage);
                });
        });

        $(document).on('click', '.deletepro', function(e) {
            e.preventDefault();
            const id = $(this).data('id');
            if (confirm('Do you really want to delete product?')) {
                const mutation = `
                    mutation DeleteProduct($id: ID!) {
                        deleteProduct(productId: $id)
                    }
                `;
                executeGraphQL(mutation, { id })
                    .then(data => {
                        if (data.deleteProduct) {
                            loadProducts(currentPage);
                        } else {
                            alert('Không thể xóa sản phẩm');
                        }
                    });
            }
        });
    </script>
</body>
</html>
