<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category GraphQL Ajax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css" />
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Quản lý Category bằng GraphQL và Ajax</h3>
        <div>
            <a th:href="@{/}" class="btn btn-outline-primary me-2">Trang Chủ</a>
            <a th:href="@{/products}" class="btn btn-outline-info me-2">Quản lý Product</a>
            <button class="btn btn-success" onclick="showCreateNewCategoryModal()">
                <i class="fas fa-plus me-2"></i>Thêm Category Ajax
            </button>
        </div>
    </div>

    <div class="row mb-3 g-2">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="searchCategoryName" class="form-control" placeholder="Tìm kiếm theo tên danh mục...">
                <button class="btn btn-primary" onclick="loadCategories(0)"><i class="fas fa-search"></i> Tìm</button>
                <button class="btn btn-outline-secondary" onclick="resetSearch()"><i class="fas fa-redo"></i></button>
            </div>
        </div>
    </div>

    <table class="table table-striped table-bordered table-responsive">
        <thead class="thead-inverse table-dark">
            <tr>
                <th style="width: 80px;">Id</th>
                <th style="width: 100px;">icon</th>
                <th>Name</th>
                <th style="width: 150px;">Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" id="paginationInfo"></span>
        <ul class="pagination pagination-sm mb-0" id="paginationNav"></ul>
    </div>

    <div class="modal fade" tabindex="-1" role="dialog" id="createCategoryModal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <form id="addCategory" method="post" onsubmit="return false;" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group mb-3">
                            <label for="new_categoryname">Category Name</label>
                            <input type="text" class="form-control" id="new_categoryname" name="categoryName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="new_icon">Icon</label>
                            <input type="file" class="form-control" id="new_icon" name="icon" accept="image/*">
                        </div>
                        <div class="form-group row">
                            <div class="col text-center">
                                <button type="submit" class="btn btn-primary btn-block w-100">Add</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" tabindex="-1" role="dialog" id="updateCategoryInfoModal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="far fa-address-card me-1"></i>Category</h5>
                        </div>
                        <div class="card-body pb-0">
                            <p id="updateCategoryInfoModalId"></p>
                            <p id="updateCategoryInfoModalName"></p>
                            <p id="updateCategoryInfoModalIcon"></p>
                        </div>
                    </div>
                    <div class="card mt-2">
                        <div class="card-header">
                            <h5><i class="far fa-address-card me-1"></i>Update Category</h5>
                        </div>
                        <div class="card-body pb-0">
                            <form id="updateCategory" method="post" onsubmit="return false;" enctype="multipart/form-data">
                                <div class="form-group mb-3">
                                    <label for="categoryName_up">Category Name</label>
                                    <input type="text" class="form-control" id="categoryName_up" name="categoryName" required>
                                </div>
                                <div class="form-group mb-3">
                                    <label for="icon_up">Icon</label>
                                    <input type="file" class="form-control" id="icon_up" name="icon" accept="image/*">
                                </div>
                                <input type="hidden" id="categoryId_up" name="categoryId">
                                <input type="hidden" id="categoryIconOld">
                                <div class="form-group row mb-3">
                                    <div class="col text-center">
                                        <button type="submit" class="btn btn-primary btn-block w-100">Cập nhật</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        let currentPage = 0;
        const pageSize = 5;

        function executeGraphQL(query, variables = {}) {
            return fetch('/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ query, variables })
            })
            .then(res => res.json())
            .then(res => {
                if (res.errors) {
                    throw new Error(res.errors.map(e => e.message).join(', '));
                }
                return res.data;
            });
        }

        $(document).ready(function() {
            loadCategories(0);

            $('#searchCategoryName').on('keyup', function(e) {
                if (e.key === 'Enter') {
                    loadCategories(0);
                }
            });
        });

        function loadCategories(page = 0) {
            currentPage = page;
            const searchName = $('#searchCategoryName').val().trim();

            const query = `
                query SearchCategories($name: String, $page: Int, $size: Int) {
                    searchCategories(name: $name, page: $page, size: $size) {
                        content {
                            categoryId
                            categoryName
                            icon
                        }
                        totalPages
                        totalElements
                        currentPage
                        pageSize
                    }
                }
            `;

            executeGraphQL(query, { name: searchName, page: page, size: pageSize })
                .then(data => {
                    const pageData = data.searchCategories;
                    const list = pageData.content || [];
                    const tbody = $('table tbody');
                    tbody.empty();

                    if (list.length === 0) {
                        tbody.html('<tr><td colspan="4" class="text-center py-3 text-muted">Không có dữ liệu</td></tr>');
                    } else {
                        const tr = [];
                        for (let i = 0; i < list.length; i++) {
                            const iconUrl = list[i].icon ? '/api/files/' + list[i].icon : 'https://placehold.co/70x70?text=Icon';
                            tr.push('<tr>');
                            tr.push('<td>' + list[i].categoryId + '</td>');
                            tr.push('<td><img src="' + iconUrl + '" style="width:70px;height:70px;object-fit:cover;" class="img-fluid rounded" alt=""></td>');
                            tr.push('<td>' + list[i].categoryName + '</td>');
                            tr.push('<td>'
                                + '<a href="#" data-id="' + list[i].categoryId + '" data-name="' + list[i].categoryName + '" data-icon="' + (list[i].icon || '') + '" class="btn btn-outline-warning mr-1 editcate"><i class="fa fa-edit"></i></a> '
                                + '<a href="#" data-id="' + list[i].categoryId + '" class="btn btn-outline-danger deletecate"><i class="fa fa-trash"></i></a>'
                                + '</td>');
                            tr.push('</tr>');
                        }
                        tbody.html(tr.join(''));
                    }

                    renderPagination(pageData.totalPages, pageData.currentPage, pageData.totalElements);
                });
        }

        function renderPagination(totalPages, activePage, totalElements) {
            $('#paginationInfo').text(`Trang ${totalPages > 0 ? activePage + 1 : 0} / ${totalPages} (Tổng: ${totalElements})`);
            const nav = $('#paginationNav');
            nav.empty();

            if (totalPages <= 1) return;

            const prevDisabled = activePage === 0 ? 'disabled' : '';
            nav.append(`<li class="page-item ${prevDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadCategories(${activePage - 1})">Trước</a></li>`);

            for (let i = 0; i < totalPages; i++) {
                const active = i === activePage ? 'active' : '';
                nav.append(`<li class="page-item ${active}"><a class="page-link" href="javascript:void(0)" onclick="loadCategories(${i})">${i + 1}</a></li>`);
            }

            const nextDisabled = activePage === totalPages - 1 ? 'disabled' : '';
            nav.append(`<li class="page-item ${nextDisabled}"><a class="page-link" href="javascript:void(0)" onclick="loadCategories(${activePage + 1})">Sau</a></li>`);
        }

        function resetSearch() {
            $('#searchCategoryName').val('');
            loadCategories(0);
        }

        function showCreateNewCategoryModal() {
            $('#new_categoryname')[0].value = '';
            $('#new_icon').val('');
            const modal = new bootstrap.Modal(document.getElementById('createCategoryModal'));
            modal.show();
        }

        async function uploadFile(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const res = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    return await res.text();
                }
            }
            return '';
        }

        $("form#addCategory").submit(async function(e) {
            e.preventDefault();
            const categoryName = $('#new_categoryname').val().trim();
            const icon = await uploadFile('new_icon');

            const mutation = `
                mutation CreateCategory($input: CategoryInput!) {
                    createCategory(input: $input) {
                        categoryId
                        categoryName
                    }
                }
            `;

            executeGraphQL(mutation, { input: { categoryName, icon } })
                .then(() => {
                    bootstrap.Modal.getInstance(document.getElementById('createCategoryModal')).hide();
                    loadCategories(0);
                });
        });

        function showEditCategoryModal(categoryId, categoryName, icon) {
            $('#updateCategoryInfoModalId').text("Category ID: " + categoryId);
            $('#updateCategoryInfoModalName').text("Category Name: " + categoryName);
            $('#updateCategoryInfoModalIcon').text('Icon: ' + (icon || 'Chưa có'));
            $('#categoryName_up').val(categoryName);
            $('#categoryId_up').val(categoryId);
            $('#categoryIconOld').val(icon || '');
            $('#icon_up').val('');
            const modal = new bootstrap.Modal(document.getElementById('updateCategoryInfoModal'));
            modal.show();
        }

        $(document).on('click', '.editcate', function(e) {
            e.preventDefault();
            const id = $(this).data('id');
            const name = $(this).data('name');
            const icon = $(this).data('icon');
            showEditCategoryModal(id, name, icon);
        });

        $("form#updateCategory").submit(async function(e) {
            e.preventDefault();
            const categoryId = $('#categoryId_up').val();
            const categoryName = $('#categoryName_up').val().trim();
            let icon = await uploadFile('icon_up');
            if (!icon) {
                icon = $('#categoryIconOld').val();
            }

            const mutation = `
                mutation UpdateCategory($id: ID!, $input: CategoryInput!) {
                    updateCategory(categoryId: $id, input: $input) {
                        categoryId
                        categoryName
                    }
                }
            `;

            executeGraphQL(mutation, { id: categoryId, input: { categoryName, icon } })
                .then(() => {
                    bootstrap.Modal.getInstance(document.getElementById('updateCategoryInfoModal')).hide();
                    loadCategories(currentPage);
                });
        });

        $(document).on('click', '.deletecate', function(e) {
            e.preventDefault();
            const id = $(this).data('id');
            if (confirm('Do you really want to delete record?')) {
                const mutation = `
                    mutation DeleteCategory($categoryId: ID!) {
                        deleteCategory(categoryId: $categoryId)
                    }
                `;
                executeGraphQL(mutation, { categoryId: id })
                    .then(data => {
                        if (data.deleteCategory) {
                            loadCategories(currentPage);
                        } else {
                            alert('Không thể xóa danh mục này');
                        }
                    });
            }
        });
    </script>
</body>
</html>
